[project]
name = "pvsys"
version = "1.0.0"
description = "AI-Based Drug Safety and Adverse Effect Analysis System (FAERS pharmacovigilance)"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S608", "S603", "B008", "E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S"]
